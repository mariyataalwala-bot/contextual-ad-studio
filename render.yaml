# Render Blueprint — Dashboard → New → Blueprint → pick this repo
services:
  - type: web
    name: contextual-ad-studio
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free                # trial: 512 MB RAM. If renders crash, switch to 'standard' (2 GB) in the Render dashboard
    healthCheckPath: /healthz
    envVars:
      - key: GEMINI_API_KEY     # free Gemini key (aistudio.google.com) — entered in the Render dashboard, never in the repo
        sync: false
      - key: ANTHROPIC_API_KEY  # optional Claude key (better picks); leave empty to use Gemini
      - key: AI_PROVIDER        # gemini | claude | openai — use `openai` to run on a free Groq / OpenRouter / Together key instead of Gemini
        sync: false
      - key: OPENAI_COMPAT_KEY  # key for the OpenAI-compatible provider (e.g. a free key from console.groq.com)
        sync: false
      - key: OPENAI_COMPAT_BASE_URL  # optional; default https://api.groq.com/openai/v1 (OpenRouter: https://openrouter.ai/api/v1)
        sync: false
      - key: OPENAI_COMPAT_MODEL     # optional; default meta-llama/llama-4-scout-17b-16e-instruct (needs a model that reads pictures)
        sync: false
        sync: false
      - key: APP_PASSWORD       # login password for the hosted page (anyone with the URL could otherwise use your key)
        sync: false
      - key: OPEN_ACCESS        # set to 1 ONLY if you want no login (anyone with the link can use the app and your AI key's quota); otherwise set APP_PASSWORD
        sync: false
      - key: LITE_MODE          # optional: 1 = never open a browser (auto-on below ~1.2 GB of memory). Free plan = lite: YouTube search needs YOUTUBE_API_KEY, no In-Image / video recording
        sync: false
      - key: YOUTUBE_API_KEY    # optional YouTube Data API key (faster, more reliable video search)
        sync: false
      - key: FIRECRAWL_API_KEY  # optional: renders JavaScript-built article pages (never refused or paywalled ones)
        sync: false
      - key: CAPTURE_PARALLEL   # one browser at a time on the free plan
        value: "1"
      - key: RENDER_SUBFRAMES   # 1 = no motion blur, ~4x faster and lighter (4 = full quality)
        value: "1"
